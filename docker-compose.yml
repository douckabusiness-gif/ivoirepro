services:
  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: boutique_postgres
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgrespassword}"
      POSTGRES_DB: "${POSTGRES_DB:-boutique_db}"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - boutique_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boutique_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-boutique_db}?schema=public"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET doit être défini avant le démarrage}"
      ADMIN_DEFAULT_EMAIL: "${ADMIN_DEFAULT_EMAIL:-}"
      ADMIN_DEFAULT_PASSWORD: "${ADMIN_DEFAULT_PASSWORD:-}"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GLM_API_KEY: "${GLM_API_KEY:-}"
      ENABLE_DEMO_MODE: "false"
      NODE_ENV: "production"
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  boutique_postgres_data:
    name: boutique_postgres_data
